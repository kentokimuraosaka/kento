<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>無料相談のお申込み｜Haiburi LLC</title>
  <meta name="description" content="Haiburi LLC の無料オンライン相談のお申込みフォームです。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="./">Haiburi LLC</a>
    <nav class="nav">
      <a href="./#programs">講座</a>
      <a href="./#flow">受講の流れ</a>
      <a href="./#faq">よくある質問</a>
      <a class="lang" href="en.html">English</a>
    </nav>
  </div>
</header>

<main class="doc">
  <div class="wrap narrow">
    <h1>無料相談のお申込み</h1>
    <p class="updated">オンライン（Zoom 等）で30分ほど、現状と目的を伺います。2営業日以内にメールでご連絡します。</p>

    <form class="form" action="https://formsubmit.co/haiburillc@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="【Haiburi LLC】無料相談のお申込み">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" id="next" value="https://haiburillc.com/thanks.html">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <label class="field">
        <span>お名前 <em>必須</em></span>
        <input type="text" name="お名前" autocomplete="name" required>
      </label>

      <label class="field">
        <span>メールアドレス <em>必須</em></span>
        <input type="email" name="email" autocomplete="email" required>
      </label>

      <label class="field">
        <span>電話番号 <small>任意</small></span>
        <input type="tel" name="電話番号" autocomplete="tel">
      </label>

      <label class="field">
        <span>ご興味のある講座 <em>必須</em></span>
        <select name="ご興味のある講座" required>
          <option value="">選択してください</option>
          <option>米国進出・LLC設立スクール</option>
          <option>バリ島 移住準備スクール</option>
          <option>中高年のためのキャリア・ライフデザイン講座</option>
          <option>まだ決めていない・その他</option>
        </select>
      </label>

      <label class="field">
        <span>ご相談内容 <em>必須</em></span>
        <textarea name="ご相談内容" rows="6" required placeholder="現在の状況や、実現したいことをご記入ください。"></textarea>
      </label>

      <label class="field">
        <span>ご希望の相談日時 <small>任意</small></span>
        <input type="text" name="ご希望の相談日時" placeholder="例：平日20時以降、土日の午前など">
      </label>

      <label class="check">
        <input type="checkbox" name="プライバシーポリシーへの同意" value="同意する" required>
        <span><a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意します</span>
      </label>

      <button class="btn" type="submit">送信する</button>
      <p class="form-note">送信後、スパム防止の確認画面が表示される場合があります。</p>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-links">
      <a href="tokushoho.html">特定商取引法に基づく表記</a>
      <a href="terms.html">利用規約</a>
      <a href="refund.html">返金ポリシー</a>
      <a href="privacy.html">プライバシーポリシー</a>
    </div>
    <div>© 2026 Haiburi LLC</div>
  </div>
</footer>

<script>
  document.getElementById('next').value = location.origin + '/thanks.html';
</script>
</body>
</html>
